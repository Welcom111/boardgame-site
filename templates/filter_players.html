<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#161d2d"><title>Фильтр по игрокам</title><link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}"><link rel="stylesheet" href="{{ url_for('static', filename='filter.css') }}"></head><body>
<header class="hero"><div class="shell"><nav class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">♟</span><span>Полка настольных игр</span></a><div class="top-nav"><a href="{{ url_for('games') }}">Все игры</a><a href="{{ url_for('filter_games') }}">Подобрать</a><a href="{{ url_for('add_game') }}">Добавить игру</a></div></nav><div class="hero-copy"><p class="eyebrow">Подбор игры</p><h1>Сколько вас сегодня?</h1><p class="subtitle">Покажем игры, которые поддерживают указанное количество участников.</p></div></div></header>
<main class="content"><section class="panel form-panel"><h2 class="form-heading">Количество игроков</h2><p class="form-intro">Введите общее число людей, которые будут участвовать в партии.</p><form method="POST"><div class="field"><label for="num_players">Игроков за столом</label><input type="number" name="num_players" id="num_players" min="1" max="20" inputmode="numeric" placeholder="Например, 4" required autofocus></div><div class="actions"><button type="submit" class="button button-primary button-wide">Найти подходящие игры →</button><a href="{{ url_for('filter_games') }}" class="button button-secondary">Назад</a></div></form></section></main></body></html>
