<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#161d2d"><title>Точный подбор игры</title><link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}"><link rel="stylesheet" href="{{ url_for('static', filename='filter.css') }}"></head><body>
<header class="hero"><div class="shell"><nav class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">♟</span><span>Полка настольных игр</span></a><div class="top-nav"><a href="{{ url_for('games') }}">Все игры</a><a href="{{ url_for('filter_games') }}">Подобрать</a><a href="{{ url_for('add_game') }}">Добавить игру</a></div></nav><div class="hero-copy"><p class="eyebrow">Точный подбор</p><h1>Идеальное совпадение</h1><p class="subtitle">Укажите жанр и размер компании — оставим только игры, подходящие по обоим условиям.</p></div></div></header>
<main class="content"><section class="panel form-panel"><h2 class="form-heading">Параметры вечера</h2><p class="form-intro">Оба поля обязательны для точного результата.</p><form method="POST"><div class="form-grid"><div class="field"><label for="category">Категория игры</label><select name="category" id="category" required autofocus><option value="">Выберите категорию</option>{% for cat in categories %}<option value="{{ cat }}">{{ cat }}</option>{% endfor %}</select></div><div class="field"><label for="num_players">Игроков за столом</label><input type="number" name="num_players" id="num_players" min="1" max="20" inputmode="numeric" placeholder="Например, 4" required></div></div><div class="actions"><button type="submit" class="button button-primary button-wide">Найти совпадения →</button><a href="{{ url_for('filter_games') }}" class="button button-secondary">Назад</a></div></form></section></main></body></html>
